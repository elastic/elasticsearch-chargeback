version: "1"
name: Chargeback - Serverless usage collector
description: >-
  Collects per-index usage from an Elastic Cloud Serverless project via _cat/indices
  and writes it into monitoring-indices-serverless in the .monitoring-es-* document
  shape. The stock chargeback contribution transforms already source monitoring-indices*,
  so they aggregate this into the same lookup indices as Elastic Cloud Hosted data with
  no transform changes. Run one copy of this workflow per Serverless project.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h
consts:
  # ---------------------------------------------------------------------------
  # REPLACE THESE FOUR VALUES before importing. sl_api_key is stored in clear
  # text in the workflow definition and is readable via GET /api/workflows, so
  # scope it to the minimum needed: cluster monitor + read/view_index_metadata.
  # Prefer a Kibana connector over an inline key for anything beyond testing.
  # ---------------------------------------------------------------------------
  sl_url: "https://<PROJECT>.es.<REGION>.<CSP>.elastic.cloud"
  sl_api_key: "<SERVERLESS_API_KEY>"
  # Must equal ess.billing.deployment_id for this project, otherwise the usage
  # rows will not join to the billing rows on composite_key.
  project_id: "<SERVERLESS_PROJECT_ID>"
  staging_index: "monitoring-indices-serverless"
  # store.size and pri.store.size are always 0 on Serverless (object storage);
  # dataset.size is the real figure. bytes=b and time=ms are required so every
  # value arrives as a plain numeric string with no unit suffix.
  cat_cols: "index,docs.count,dataset.size,indexing.index_time,indexing.index_total,search.query_time,search.query_total"
steps:
  - name: fetch_cat_indices
    type: http
    timeout: "60s"
    on-failure:
      retry:
        max-attempts: 3
        delay: "10s"
        strategy: exponential
    with:
      method: GET
      url: "{{consts.sl_url}}/_cat/indices?h={{consts.cat_cols}}&format=json&bytes=b&time=ms&expand_wildcards=all"
      headers:
        Authorization: "ApiKey {{consts.sl_api_key}}"

  # One document per index per run. These are cumulative-counter snapshots, exactly
  # like Metricbeat produces for ECH: the transforms sum them and the dashboards
  # divide datastream_sum_X / deployment_sum_X, so snapshot frequency cancels out and
  # shard-level counter resets can never produce a negative delta. Do not convert
  # this to a delta calculation.
  - name: write_rows
    type: foreach
    foreach: "${{ steps.fetch_cat_indices.output.data }}"
    steps:
      - name: index_row
        type: elasticsearch.request
        on-failure:
          continue: true
        with:
          method: POST
          path: "/{{consts.staging_index}}/_doc"
          body:
            idx: "{{ foreach.item['index'] }}"
            project: "{{consts.project_id}}"
            docs: "{{ foreach.item['docs.count'] }}"
            dsize: "{{ foreach.item['dataset.size'] }}"
            itime: "{{ foreach.item['indexing.index_time'] }}"
            itotal: "{{ foreach.item['indexing.index_total'] }}"
            qtime: "{{ foreach.item['search.query_time'] }}"
            qtotal: "{{ foreach.item['search.query_total'] }}"

  # Snapshots are only needed until the day bucket they belong to has been
  # aggregated, so 30 days is generous. Without this the staging index grows
  # without bound (indices x 24 per day).
  - name: prune_old_snapshots
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: POST
      path: "/{{consts.staging_index}}/_delete_by_query"
      body:
        query:
          range:
            "@timestamp":
              lt: "now-30d"

  - name: summary
    type: console
    with:
      message: "Serverless usage collected: {{ steps.fetch_cat_indices.output.data | size }} indices for project {{consts.project_id}}"
