version: "1"
name: Chargeback - cost review
description: >-
  Deterministic cost review for the Elastic Cost Optimizer agent. Runs the four opening
  queries in a fixed order and returns them as one payload: active configuration, deployment
  classification (hosted versus serverless versus on-prem), cost per deployment, and
  provisioned-versus-realized capacity over a fixed 30-day window. Exposed to the agent as
  the workflow tool `chargeback.cost_review` so the ordering is guaranteed rather than left
  to the model's tool selection - in particular the platform classification is always present,
  which stops the agent guessing that a Hosted deployment with no node_stats is a Serverless
  project.
enabled: true
triggers:
  - type: manual
consts:
  # Preserve billing @timestamp and resolve both Cloud ECU and On-Premises mERU rate windows.
  conf_join: >-
    | EVAL ts = COALESCE(billing_ts, @timestamp), cloud_cfg_key = "chargeback_config"
    | LOOKUP JOIN chargeback_conf_lookup ON cloud_cfg_key == config_join_key AND ts >= conf_start_date AND ts <= conf_end_date
    | EVAL cloud_rate = conf_chargeable_unit_rate, cloud_unit = conf_chargeable_unit_rate_unit,
    c_mem_w = TO_DOUBLE(conf_utilization_memory_weight), c_disk_w = TO_DOUBLE(conf_utilization_storage_weight),
    c_util_floor = TO_DOUBLE(conf_utilization_floor)
    | DROP cloud_cfg_key, config_join_key, conf_start_date, conf_end_date, conf_chargeable_unit_rate, conf_chargeable_unit_rate_unit
    | EVAL onprem_cfg_key = CASE(is_onprem_row, "chargeback_config_onprem", null)
    | LOOKUP JOIN chargeback_conf_lookup ON onprem_cfg_key == config_join_key AND ts >= conf_start_date AND ts <= conf_end_date
    | EVAL rate = CASE(is_onprem_row, COALESCE(conf_chargeable_unit_rate, 0.00085), COALESCE(cloud_rate, 0.85)),
    currency_unit = CASE(is_onprem_row, COALESCE(conf_chargeable_unit_rate_unit, cloud_unit, "EUR"), COALESCE(cloud_unit, "EUR")),
    mem_w = CASE(is_onprem_row, COALESCE(TO_DOUBLE(conf_utilization_memory_weight), c_mem_w, 70.0), COALESCE(c_mem_w, 70.0)),
    disk_w = CASE(is_onprem_row, COALESCE(TO_DOUBLE(conf_utilization_storage_weight), c_disk_w, 30.0), COALESCE(c_disk_w, 30.0)),
    util_floor = CASE(is_onprem_row, COALESCE(TO_DOUBLE(conf_utilization_floor), c_util_floor, 0.10), COALESCE(c_util_floor, 0.10))
steps:
  - name: configuration
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: >-
          FROM chargeback_conf_lookup | KEEP config_join_key, conf_chargeable_unit_rate,
          conf_chargeable_unit_rate_unit, conf_indexing_weight, conf_query_weight,
          conf_storage_weight, conf_utilization_memory_weight,
          conf_utilization_storage_weight, conf_utilization_floor, conf_start_date,
          conf_end_date | LIMIT 10

  # Deliberately second, and always run: platform classification must be in front of the
  # model before it can offer platform-specific advice.
  - name: deployment_inventory
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: >-
          FROM chargeback_lookup.billing_cluster_cost | WHERE DATE_DIFF("day", @timestamp, NOW()) <= 30 |
          EVAL platform = CASE(COALESCE(is_onprem, false) OR ess.billing.deployment_type IN ("onprem", "ece", "eck")
          OR cloud.provider == "onprem", "onprem", ess.billing.deployment_type == "deployment", "hosted",
          ess.billing.deployment_type IN ("elasticsearch", "observability", "security", "vectordb"), "serverless", "unknown") |
          STATS chargeable_units = SUM(total_chargeable_units), skus = COUNT_DISTINCT(sku)
          BY deployment_id, deployment_name, deployment_type = ess.billing.deployment_type,
          platform, region = cloud.region, provider = cloud.provider |
          SORT chargeable_units DESC | LIMIT 50

  - name: cost_by_deployment
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: >-
          FROM chargeback_lookup.billing_cluster_cost | EVAL billing_ts = @timestamp,
          is_onprem_row = COALESCE(is_onprem, ess.billing.deployment_type IN ("onprem", "ece", "eck") OR cloud.provider == "onprem", false) |
          WHERE DATE_DIFF("day", billing_ts, NOW()) <= 30 {{consts.conf_join}} | EVAL cost = total_chargeable_units *
          rate | STATS cost = SUM(cost), currency = VALUES(currency_unit), days_covered =
          COUNT_DISTINCT(billing_ts) BY deployment_id, deployment_name, deployment_group |
          SORT cost DESC | LIMIT 50

  - name: utilization_waste
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: >-
          FROM chargeback_lookup.billing_realized_pool | WHERE @timestamp IS NOT NULL AND data_tier_capacity_ecu IS NOT NULL |
          EVAL billing_ts = @timestamp, ck = composite_key::keyword, billing_deployment_id
          = deployment_id, billing_deployment_name = deployment_name, is_onprem_row = COALESCE(is_onprem, false) |
          WHERE DATE_DIFF("day", billing_ts, NOW()) <= 30 | DROP composite_key | LOOKUP JOIN
          cluster_capacity_utilization_lookup ON ck == composite_key | DROP composite_key {{consts.conf_join}} | EVAL heap_util =
          COALESCE(heap_used_pct_p95, 100.0) / 100.0, disk_util = COALESCE(disk_used_pct_p95, 100.0)
          / 100.0 | EVAL raw_utilization_score = CASE(mem_w + disk_w > 0.0,
          (mem_w * heap_util + disk_w * disk_util) / (mem_w + disk_w), 1.0) | EVAL utilization_score = CASE(raw_utilization_score < util_floor,
          util_floor, raw_utilization_score) | EVAL provisioned_cost = data_tier_capacity_ecu * rate,
          realized_cost = data_tier_capacity_ecu * COALESCE(utilization_score, 1.0) * rate | EVAL
          no_utilization_data = heap_used_pct_p95 IS NULL AND disk_used_pct_p95 IS NULL |
          STATS provisioned_cost = SUM(provisioned_cost), realized_cost = SUM(realized_cost),
          currency = VALUES(currency_unit), avg_heap_pct = AVG(heap_used_pct_p95), avg_disk_pct = AVG(disk_used_pct_p95),
          no_utilization_data = MAX(no_utilization_data) BY deployment_id = billing_deployment_id,
          deployment_name = billing_deployment_name |
          EVAL wasted_cost = provisioned_cost - realized_cost | SORT wasted_cost DESC | LIMIT 50

  # A workflow tool receives only the LAST step's output, not the declared `outputs:`
  # block, so the combined payload has to be assembled here as the final step.
  - name: review
    type: console
    with:
      message: >-
        {"window_days": 30,
        "configuration": {{ steps.configuration.output | json }},
        "deployment_inventory": {{ steps.deployment_inventory.output | json }},
        "cost_by_deployment": {{ steps.cost_by_deployment.output | json }},
        "utilization_waste": {{ steps.utilization_waste.output | json }}}

outputs:
  window_days: 30
  configuration: "${{steps.configuration.output}}"
  deployment_inventory: "${{steps.deployment_inventory.output}}"
  cost_by_deployment: "${{steps.cost_by_deployment.output}}"
  utilization_waste: "${{steps.utilization_waste.output}}"
