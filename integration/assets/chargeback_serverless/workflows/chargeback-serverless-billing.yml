version: "1"
name: Chargeback Serverless - Billing
description: >-
  Daily: fetch Elastic Cloud costs/instances for a date window, keep Serverless
  instance types only, and write classified rows into billing_cluster_cost_lookup
  through the chargeback-serverless-billing ingest pipeline. Pass inputs.from
  and inputs.to (ISO UTC) for the window; the installer/docs show examples.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 24h
consts:
  config_index: "chargeback-serverless-config"
  config_id: "config"
  projects_index: "chargeback-serverless-projects"
  billing_lookup: "billing_cluster_cost_lookup"
  pool_lookup: "billing_realized_pool_lookup"
  pipeline: "chargeback-serverless-billing"
  billing_api_base: "https://billing.elastic-cloud.com"
steps:
  - name: load_config
    type: elasticsearch.request
    with:
      method: GET
      path: "/{{consts.config_index}}/_doc/{{consts.config_id}}"

  - name: load_projects
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: POST
      path: "/{{consts.projects_index}}/_search"
      headers:
        Content-Type: "application/json"
      body: |
        { "size": 500, "query": { "match_all": {} } }

  - name: ensure_pool_mapping
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: "/{{consts.pool_lookup}}/_mapping"
      headers:
        Content-Type: "application/json"
      body: |
        {
          "properties": {
            "indexing_ecu": { "type": "double" },
            "query_ecu": { "type": "double" },
            "storage_ecu": { "type": "double" }
          }
        }

  - name: ensure_conf_mapping
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: "/chargeback_conf_lookup/_mapping"
      headers:
        Content-Type: "application/json"
      body: |
        {
          "properties": {
            "conf_currency_symbol": { "type": "keyword" }
          }
        }

  - name: ensure_pipeline
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: "/_ingest/pipeline/{{consts.pipeline}}"
      headers:
        Content-Type: "application/json"
      body: |
        {
          "description": "Chargeback Serverless: build composite_key, classify Serverless SKUs, and set allocation_driver (indexing | query | storage | none) for showback.",
          "processors": [
            {
              "script": {
                "ignore_failure": true,
                "lang": "painless",
                "tag": "project_fields_and_composite_key",
                "source": "if (ctx.deployment_id == null && ctx.project_id != null) { ctx.deployment_id = ctx.project_id; } if ((ctx.deployment_name == null || ctx.deployment_name == '') && ctx.project_name != null && ctx.project_name != '') { ctx.deployment_name = ctx.project_name; } if (ctx.deployment_type == null && ctx.project_type != null) { ctx.deployment_type = ctx.project_type; } if (ctx.total_ecu == null && ctx.total_chargeable_units != null) { ctx.total_ecu = ctx.total_chargeable_units; } ctx.remove('project_id'); ctx.remove('project_name'); ctx.remove('project_type'); ctx.remove('total_chargeable_units'); if (ctx['@timestamp'] != null && ctx.deployment_id != null) { ctx.composite_key = ZonedDateTime.parse(ctx['@timestamp']).toLocalDate().toString() + '_' + ctx.deployment_id; }"
              }
            },
            {
              "set": {
                "field": "cost_type",
                "value": "data-transfer",
                "if": "ctx.sku != null && ctx.sku =~ /^(aws|gcp|azure)\\.(data-transfer|data-out).*/"
              }
            },
            {
              "set": {
                "field": "cost_type",
                "value": "snapshots",
                "if": "ctx.sku != null && ctx.sku =~ /^(aws|gcp|azure)\\.snapshot-storage.*/"
              }
            },
            {
              "set": {
                "field": "cost_type",
                "value": "inference",
                "if": "ctx.sku == 'global.inference-chat-input'"
              }
            },
            {
              "script": {
                "ignore_failure": true,
                "lang": "painless",
                "source": "def sku = ctx.sku; if (sku == null) { ctx.cost_type = 'other'; ctx.cost_category = 'other'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } if (sku.startsWith('observability.') || sku.startsWith('security.')) { if (sku.contains('retained') || sku.contains('storage') || sku.contains('retention')) { ctx.cost_type = 'retained'; ctx.cost_category = 'data_tier'; ctx.is_allocatable = true; ctx.allocation_driver = 'storage'; return; } if (sku.contains('ingest') || sku.contains('logs') || sku.contains('metrics') || sku.contains('traces') || sku.contains('apm') || sku.contains('siem')) { ctx.cost_type = 'ingest'; ctx.cost_category = 'data_tier'; ctx.is_allocatable = true; ctx.allocation_driver = 'indexing'; return; } } if (sku.startsWith('elasticsearch.') || sku.startsWith('vector.') || sku.startsWith('elasticsearch-vector.')) { if (sku.contains('-ingest-vcu_') || sku.contains('ingest-vcu')) { ctx.cost_type = 'ingest-vcu'; ctx.cost_category = 'data_tier'; ctx.is_allocatable = true; ctx.allocation_driver = 'indexing'; return; } if (sku.contains('-search-vcu_') || sku.contains('search-vcu')) { ctx.cost_type = 'search-vcu'; ctx.cost_category = 'data_tier'; ctx.is_allocatable = true; ctx.allocation_driver = 'query'; return; } if (sku.startsWith('elasticsearch.retained_') || sku.contains('retained_') || sku.contains('storage')) { ctx.cost_type = 'retained'; ctx.cost_category = 'data_tier'; ctx.is_allocatable = true; ctx.allocation_driver = 'storage'; return; } if (sku.contains('-ml-vcu_') || sku.contains('ml-vcu')) { ctx.cost_type = 'ml-vcu'; ctx.cost_category = 'platform'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } } if (sku.startsWith('serverless.support-')) { ctx.cost_type = 'serverless_premium_support'; ctx.cost_category = 'support'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } if (ctx.cost_type == 'data-transfer' || sku.contains('data-transfer') || sku.contains('data-out') || sku.contains('egress')) { ctx.cost_type = 'data-transfer'; ctx.cost_category = 'transfer'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } if (ctx.cost_type == 'snapshots' || sku.contains('snapshot')) { ctx.cost_type = 'snapshots'; ctx.cost_category = 'snapshot'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } if (ctx.cost_type == 'inference' || sku.contains('inference') || sku.contains('llm')) { ctx.cost_type = 'inference'; ctx.cost_category = 'platform'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } if (sku.contains('synthetics')) { ctx.cost_type = 'synthetics'; ctx.cost_category = 'platform'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } if (sku.contains('workflow')) { ctx.cost_type = 'workflows'; ctx.cost_category = 'platform'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } if (sku.contains('agent-builder')) { ctx.cost_type = 'agent-builder'; ctx.cost_category = 'platform'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } if (sku.contains('cross-project') || sku.contains('cps')) { ctx.cost_type = 'cross-project-search'; ctx.cost_category = 'platform'; ctx.is_allocatable = false; ctx.allocation_driver = 'none'; return; } ctx.cost_category = 'other'; ctx.is_allocatable = false; ctx.allocation_driver = 'none';"
              }
            },
            {
              "grok": {
                "field": "sku",
                "ignore_failure": true,
                "patterns": [
                  "%{WORD}.es.%{WORD:cost_type}.%{GREEDYDATA}",
                  "%{WORD}.%{DATA:cost_type}-vcu_%{GREEDYDATA}",
                  "%{WORD}.%{WORD:cost_type}.%{GREEDYDATA}",
                  "%{WORD}.%{DATA:cost_type}_%{GREEDYDATA}"
                ],
                "if": "ctx.cost_type == null && ctx.sku != null"
              }
            },
            {
              "set": {
                "field": "event.ingested",
                "value": "{% raw %}{{{_ingest.timestamp}}}{% endraw %}",
                "tag": "set_event_ingested"
              }
            }
          ]
        }

  - name: compute_window
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{consts.config_index}}/_search"
      headers:
        Content-Type: "application/json"
      body: |
        {
          "size": 1,
          "query": { "ids": { "values": ["{{consts.config_id}}"] } },
          "script_fields": {
            "window": {
              "script": {
                "lang": "painless",
                "source": "ZonedDateTime now = ZonedDateTime.ofInstant(Instant.ofEpochMilli(System.currentTimeMillis()), ZoneOffset.UTC); ZonedDateTime to = now.truncatedTo(ChronoUnit.DAYS); ZonedDateTime from = to.minusDays(1); if (params.from_in != null && params.from_in.length() > 0 && params.to_in != null && params.to_in.length() > 0) { from = ZonedDateTime.parse(params.from_in); to = ZonedDateTime.parse(params.to_in); if (!to.isAfter(from)) { to = from.plusDays(1); } } List days = new ArrayList(); ZonedDateTime cur = from.truncatedTo(ChronoUnit.DAYS); while (cur.isBefore(to)) { ZonedDateTime nxt = cur.plusDays(1); if (nxt.isAfter(to)) { nxt = to; } days.add(['day': cur.toLocalDate().toString(), 'from': cur.format(DateTimeFormatter.ISO_INSTANT), 'to': nxt.format(DateTimeFormatter.ISO_INSTANT)]); cur = nxt; } return ['from': from.format(DateTimeFormatter.ISO_INSTANT), 'to': to.format(DateTimeFormatter.ISO_INSTANT), 'days': days];",
                "params": {
                  "from_in": {{ inputs.from | default: "" | json }},
                  "to_in": {{ inputs.to | default: "" | json }}
                }
              }
            }
          }
        }

  - name: for_each_day
    type: foreach
    foreach: "{{ steps.compute_window.output.hits.hits[0].fields.window[0].days }}"
    on-failure:
      continue: true
    steps:
      - name: fetch_costs
        type: http
        timeout: "120s"
        with:
          method: GET
          url: "{{ steps.load_config.output._source.billing_api_base | default: consts.billing_api_base }}/api/v2/billing/organizations/{{ steps.load_config.output._source.organization_id }}/costs/instances?from={{ foreach.item.from }}&to={{ foreach.item.to }}"
          headers:
            Authorization: "ApiKey {{ steps.load_config.output._source.billing_api_key }}"

      - name: write_billing_rows
        type: elasticsearch.request
        on-failure:
          continue: true
        with:
          method: POST
          path: "/_bulk?pipeline={{consts.pipeline}}&refresh=true"
          headers:
            Content-Type: "application/x-ndjson"
          body: |
            {% assign instances = steps.fetch_costs.output.data.instances | default: steps.fetch_costs.output.instances | default: empty -%}
            {% assign proj_hits = steps.load_projects.output.hits.hits | default: empty -%}
            {% assign day = foreach.item.day -%}
            {% for instance in instances -%}
            {% if instance.type == "elasticsearch" or instance.type == "observability" or instance.type == "security" -%}
            {% assign pname = instance.name | default: "" -%}
            {% if pname == "" -%}
            {% for ph in proj_hits -%}
            {% if ph._source.project_id == instance.id and ph._source.project_name and ph._source.project_name != "" -%}
            {% assign pname = ph._source.project_name -%}
            {% endif -%}
            {% endfor -%}
            {% endif -%}
            {% if pname == "" -%}{% assign pname = instance.id -%}{% endif -%}
            {% for line in instance.product_line_items -%}
            {"index":{"_index":"{{consts.billing_lookup}}","_id":"{{day}}|{{instance.id}}|{{line.sku}}|{{line.type | default: 'default'}}|{{line.kind | default: 'default'}}"}}
            {"@timestamp":"{{day}}T00:00:00.000Z","deployment_id":"{{instance.id}}","deployment_name":{{ pname | json }},"deployment_type":"{{instance.type}}","sku":{{ line.sku | json }},"type":{{ line.type | json }},"kind":{{ line.kind | json }},"total_ecu":{{ line.total_ecu }},"quantity_value":{{ line.quantity.value | default: 0 }}}
            {% endfor -%}
            {% endif -%}
            {% endfor -%}

      - name: aggregate_realized_pool
        type: elasticsearch.request
        on-failure:
          continue: true
        with:
          method: POST
          path: "/{{consts.billing_lookup}}/_search"
          headers:
            Content-Type: "application/json"
          body: |
            {
              "size": 0,
              "query": {
                "bool": {
                  "filter": [
                    { "term": { "@timestamp": "{{ foreach.item.day }}T00:00:00.000Z" } },
                    { "term": { "is_allocatable": true } }
                  ]
                }
              },
              "aggs": {
                "by_project": {
                  "terms": { "field": "composite_key", "size": 1000 },
                  "aggs": {
                    "meta": {
                      "top_hits": {
                        "size": 1,
                        "_source": ["deployment_id", "deployment_name", "deployment_type", "deployment_group"]
                      }
                    },
                    "total_ecu": { "sum": { "field": "total_ecu" } },
                    "indexing_ecu": {
                      "filter": { "terms": { "cost_type": ["ingest-vcu", "ingest"] } },
                      "aggs": { "val": { "sum": { "field": "total_ecu" } } }
                    },
                    "query_ecu": {
                      "filter": { "terms": { "cost_type": ["search-vcu", "ml-vcu"] } },
                      "aggs": { "val": { "sum": { "field": "total_ecu" } } }
                    },
                    "storage_ecu": {
                      "filter": { "term": { "cost_type": "retained" } },
                      "aggs": { "val": { "sum": { "field": "total_ecu" } } }
                    },
                    "ai_ecu": {
                      "filter": { "terms": { "cost_type": ["ml-vcu", "inference"] } },
                      "aggs": { "val": { "sum": { "field": "total_ecu" } } }
                    }
                  }
                }
              }
            }

      - name: write_realized_pool
        type: elasticsearch.request
        on-failure:
          continue: true
        with:
          method: POST
          path: "/_bulk?refresh=true"
          headers:
            Content-Type: "application/x-ndjson"
          body: |
            {% assign buckets = steps.aggregate_realized_pool.output.aggregations.by_project.buckets | default: empty -%}
            {% for b in buckets -%}
            {% assign doc = b.meta.hits.hits[0]._source -%}
            {"index":{"_index":"{{consts.pool_lookup}}","_id":"{{ b.key }}"}}
            {"@timestamp":"{{ foreach.item.day }}T00:00:00.000Z","composite_key":"{{ b.key }}","deployment_id":{{ doc.deployment_id | json }},"deployment_name":{{ doc.deployment_name | json }},"deployment_type":{{ doc.deployment_type | json }},"deployment_group":{{ doc.deployment_group | default: "serverless" | json }},"allocation_driver":"vcu_weighted","total_ecu":{{ b.total_ecu.value | default: 0 }},"indexing_ecu":{{ b.indexing_ecu.val.value | default: 0 }},"query_ecu":{{ b.query_ecu.val.value | default: 0 }},"storage_ecu":{{ b.storage_ecu.val.value | default: 0 }},"ai_ecu":{{ b.ai_ecu.val.value | default: 0 }}}
            {% endfor -%}

  - name: summary
    type: console
    with:
      message: "Chargeback Serverless billing finished for window {{ steps.compute_window.output.hits.hits[0].fields.window[0].from }} -> {{ steps.compute_window.output.hits.hits[0].fields.window[0].to }}"
